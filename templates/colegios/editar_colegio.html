<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar {{ colegio.nombre }} - Eduteka</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .card-custom { border: none; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    </style>
</head>
<body class="p-4">
    <div class="container max-width-md" style="max-width: 800px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <a href="{% url 'dashboard_superadmin_colegios' %}" class="btn btn-outline-secondary btn-sm mb-2 rounded-pill">
                    <i class="bi bi-arrow-left"></i> Volver a Colegios
                </a>
                <h1 class="fw-bold fs-3 mb-0">Editar Ficha del Colegio</h1>
            </div>
        </div>

        <div class="card card-custom p-4 bg-white">
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-md-8">
                        <label class="form-label fw-semibold">Nombre del Colegio</label>
                        <input type="text" name="nombre" class="form-control" value="{{ colegio.nombre }}" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Nombre Corto</label>
                        <input type="text" name="nombre_corto" class="form-control" value="{{ colegio.nombre_corto|default:'' }}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Correo Institucional</label>
                        <input type="email" name="correo_institucional" class="form-control" value="{{ colegio.correo_institucional }}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Teléfono</label>
                        <input type="text" name="telefono" class="form-control" value="{{ colegio.telefono }}" required>
                    </div>

                    <div class="col-md-8">
                        <label class="form-label fw-semibold">Dirección</label>
                        <input type="text" name="direccion" class="form-control" value="{{ colegio.direccion|default:'' }}">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Ciudad / Comuna</label>
                        <input type="text" name="ciudad_comuna" class="form-control" value="{{ colegio.ciudad_comuna }}" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Tipo Institución</label>
                        <select name="tipo_institucion" class="form-select">
                            {% for key, val in colegio.TIPO_INSTITUCION %}
                            <option value="{{ key }}" {% if colegio.tipo_institucion == key %}selected{% endif %}>{{ val }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Cantidad Alumnos</label>
                        <select name="cantidad_alumnos" class="form-select">
                            {% for key, val in colegio.CANTIDAD_ALUMNOS %}
                            <option value="{{ key }}" {% if colegio.cantidad_alumnos == key %}selected{% endif %}>{{ val }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Estado</label>
                        <select name="estado" class="form-select">
                            {% for key, val in colegio.ESTADOS %}
                            <option value="{{ key }}" {% if colegio.estado == key %}selected{% endif %}>{{ val }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-12 mt-4 d-flex justify-content-end gap-2">
                        <a href="{% url 'dashboard_superadmin_colegios' %}" class="btn btn-light border rounded-pill px-4">Cancelar</a>
                        <button type="submit" class="btn btn-primary rounded-pill px-4">Guardar Cambios</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
