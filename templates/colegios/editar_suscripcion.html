<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Plan y Suscripción - {{ colegio.nombre }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .card-custom { border: none; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    </style>
</head>
<body class="p-4">
    <div class="container max-width-md" style="max-width: 700px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <a href="{% url 'ver_detalle_colegio' colegio.id %}" class="btn btn-outline-secondary btn-sm mb-2 rounded-pill">
                    <i class="bi bi-arrow-left"></i> Volver a Detalles
                </a>
                <h1 class="fw-bold fs-3 mb-0">Editar Plan y Suscripción</h1>
                <p class="text-muted small mb-0">Establecimiento: {{ colegio.nombre }}</p>
            </div>
        </div>

        <div class="card card-custom p-4 bg-white">
            <form method="POST">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label fw-semibold">Seleccionar Plan de Suscripción</label>
                        <select name="plan_id" class="form-select" required>
                            <option value="" disabled {% if not suscripcion %}selected{% endif %}>Elija un plan...</option>
                            {% for plan in planes %}
                            <option value="{{ plan.id }}" {% if suscripcion and suscripcion.plan.id == plan.id %}selected{% endif %}>
                                {{ plan.nombre }} - (${{ plan.precio_mensual }}/mes | ${{ plan.precio_anual }}/año)
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Tipo de Facturación</label>
                        <select name="tipo_facturacion" class="form-select">
                            <option value="mensual" {% if suscripcion and suscripcion.tipo_facturacion == 'mensual' %}selected{% endif %}>Mensual</option>
                            <option value="anual" {% if suscripcion and suscripcion.tipo_facturacion == 'anual' %}selected{% endif %}>Anual</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Estado de la Suscripción</label>
                        <select name="estado" class="form-select">
                            <option value="activa" {% if suscripcion and suscripcion.estado == 'activa' %}selected{% endif %}>Activa</option>
                            <option value="pendiente_pago" {% if suscripcion and suscripcion.estado == 'pendiente_pago' %}selected{% endif %}>Pendiente de Pago</option>
                            <option value="vencida" {% if suscripcion and suscripcion.estado == 'vencida' %}selected{% endif %}>Vencida</option>
                            <option value="cancelada" {% if suscripcion and suscripcion.estado == 'cancelada' %}selected{% endif %}>Cancelada</option>
                        </select>
                    </div>

                    <div class="col-12 mt-4 d-flex justify-content-end gap-2">
                        <a href="{% url 'ver_detalle_colegio' colegio.id %}" class="btn btn-light border rounded-pill px-4">Cancelar</a>
                        <button type="submit" class="btn btn-primary rounded-pill px-4">Guardar Suscripción</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
